name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax / check
        run: |
          python -m compileall -q src
          cd src && python manage.py check

      - name: Apply migrations
        run: |
          cd src && python manage.py migrate --noinput

      - name: Import fuel prices CSV
        run: |
          cd src && python manage.py import_fuel_prices ../prompts/fuel-prices-for-be-assessment.csv

      - name: Load demo fixture
        run: |
          cd src && python manage.py load_demo_fixture

      - name: Run tests (offline, mocked providers)
        run: |
          python -m pytest -q src/routing/tests

      - name: Ruff lint
        run: |
          ruff check src
